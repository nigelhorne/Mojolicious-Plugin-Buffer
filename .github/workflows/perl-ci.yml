---
# Created by App::GHGen::PerlCustomizer
name: Perl CI

"on":
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # The live Redis lock test is skipped everywhere else, so this job keeps the
  # claim that it passes with both clients from going stale.  Each client gets
  # its own step, and each step proves from the test output which one ran.
  live-redis:
    name: Live Redis lock backend
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      AUTOMATED_TESTING: 1
      NONINTERACTIVE_TESTING: 1
      MPB_REDIS_URL: redis://127.0.0.1:6379
    steps:
      - uses: actions/checkout@v7

      - name: Setup Perl
        uses: shogo82148/actions-setup-perl@v1.44.3
        with:
          perl-version: "5.40"

      - name: Cache CPAN modules
        uses: actions/cache@v6
        with:
          path: ~/perl5
          key: ${{ runner.os }}-perl-5.40-live-redis-${{ hashFiles('cpanfile') }}
          restore-keys: |
            ${{ runner.os }}-perl-5.40-live-redis-

      - name: Install cpanm and local::lib
        run: cpanm --notest --local-lib=~/perl5 local::lib

      - name: Install dependencies and Redis
        run: |
          eval $(perl -I ~/perl5/lib/perl5 -Mlocal::lib)
          cpanm --notest --installdeps .
          cpanm --notest Redis Test::Without::Module

      # Redis::Fast 0.39 bundles an old hiredis whose warnings are fatal under
      # -Werror on modern compilers, so build it from a patched copy rather
      # than letting cpanm fail the job
      - name: Install Redis::Fast
        run: |
          eval $(perl -I ~/perl5/lib/perl5 -Mlocal::lib)
          mkdir -p "$RUNNER_TEMP/redis-fast"
          cd "$RUNNER_TEMP/redis-fast"
          info=$(cpanm --info Redis::Fast)
          author=${info%%/*}
          curl -fsSLO "https://cpan.metacpan.org/authors/id/${author:0:1}/${author:0:2}/$info"
          tar xzf "${info#*/}"
          sed -i 's/-Werror//g' Redis-Fast-*/deps/hiredis/Makefile
          cpanm --notest ./Redis-Fast-*/

      - name: Run the live test with Redis
        id: redis-run
        run: |
          eval $(perl -I ~/perl5/lib/perl5 -Mlocal::lib)
          log="$RUNNER_TEMP/redis.log"
          # The client notice is a diagnostic, which Test::More writes to
          # STDERR outside a harness, so both streams have to be captured
          perl -Ilib t/76-live-redis.t 2>&1 | tee "$log"
          grep -q '^# the live Redis test is using Redis$' "$log"
          grep -q 'the live Redis server is reachable' "$log"

      - name: Run the live test with Redis::Fast only
        id: redis-fast-run
        env:
          PERL5OPT: -MTest::Without::Module=Redis
        run: |
          eval $(perl -I ~/perl5/lib/perl5 -Mlocal::lib)
          # Fail if Redis is still loadable, so this really is the fallback path
          perl -MTest::Without::Module=Redis \
            -e 'exit(eval { require Redis; 1 } ? 1 : 0)'
          log="$RUNNER_TEMP/redis-fast.log"
          perl -Ilib t/76-live-redis.t 2>&1 | tee "$log"
          grep -q '^# the live Redis test is using Redis::Fast$' "$log"
          grep -q 'the live Redis server is reachable' "$log"

      # Runs even when a test step failed, so a red job says which client was
      # reached instead of leaving the only evidence in the raw log
      - name: Summarise the clients used
        if: always()
        run: |
          client_of() {
            if [ -f "$1" ]; then
              awk '/^# the live Redis test is using / {
                     sub(/^# the live Redis test is using /, ""); print; exit
                   }' "$1"
            fi
            return 0
          }
          tests_of() {
            if [ -f "$1" ]; then
              awk '/^1\.\.[0-9]+$/ { plan = $0 } END { print plan ? substr(plan, 4) : "-" }' "$1"
            else
              echo '-'
            fi
            return 0
          }
          redis_log="$RUNNER_TEMP/redis.log"
          fast_log="$RUNNER_TEMP/redis-fast.log"
          redis_client=$(client_of "$redis_log")
          fast_client=$(client_of "$fast_log")

          {
            echo '### Live Redis lock backend'
            echo
            echo "Server: \`${MPB_REDIS_URL}\`"
            echo
            echo '| Run | Client reported by the test | Tests | Outcome |'
            echo '| --- | --- | --- | --- |'
            echo "| with Redis | ${redis_client:-not reported} | $(tests_of "$redis_log") | ${{ steps.redis-run.outcome }} |"
            echo "| Redis::Fast only | ${fast_client:-not reported} | $(tests_of "$fast_log") | ${{ steps.redis-fast-run.outcome }} |"
            echo
            if [ -z "$redis_client" ] || [ -z "$fast_client" ]; then
              echo 'A client shown as `not reported` produced no client notice: the run never reached the test body, so read that step log.'
            else
              echo 'Each client is read from the test output, so the row describes the run rather than the modules installed.'
            fi
          } >> "$GITHUB_STEP_SUMMARY"

  test:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest
        perl:
          - "5.36"
          - "5.38"
          - "5.40"
          - "5.42"
        exclude:
          - os: windows-latest
            perl: "5.40"
    name: Perl ${{ matrix.perl }} on ${{ matrix.os }}
    env:
      AUTOMATED_TESTING: 1
      NO_NETWORK_TESTING: 1
      NONINTERACTIVE_TESTING: 1
    steps:
      - uses: actions/checkout@v7

      - name: Setup Perl
        id: setup-perl
        uses: shogo82148/actions-setup-perl@v1.44.3
        with:
          perl-version: ${{ matrix.perl }}

      - name: Get exact Perl binary version for cache key
        id: perl-version
        shell: perl {0}
        run: |
          use Config;
          my @paths = ($^X);
          if ($^O eq 'MSWin32' && $Config{libperl}) {
              (my $dir = $^X) =~ s{[\\/][^\\/]+$}{};
              my $dll = "$dir/$Config{libperl}";
              push @paths, $dll if -f $dll;
          }
          my $sum = 0;
          for my $path (@paths) {
              open(my $fh, '<:raw', $path) or next;
              $sum += unpack('%32C*', $_) while read $fh, $_, 65536;
          }
          open(my $out, '>>', $ENV{GITHUB_OUTPUT}) or die $!;
          print $out "version=$Config{version}-$Config{archname}-$sum\n";

      - name: Cache CPAN modules
        uses: actions/cache@v6
        with:
          path: ~/perl5
          key: ${{ runner.os }}-perl-${{ steps.perl-version.outputs.version }}-${{ hashFiles('cpanfile') }}
          restore-keys: |
            ${{ runner.os }}-perl-${{ steps.perl-version.outputs.version }}-

      - name: Install cpanm and local::lib
        if: runner.os != 'Windows'
        run: cpanm --notest --local-lib=~/perl5 local::lib

      - name: Install cpanm and local::lib (Windows)
        if: runner.os == 'Windows'
        run: cpanm --notest App::cpanminus local::lib

      - name: Install DB_File, needed for a lot of CPAN modules
        if: runner.os == 'Linux'
        run: |
           sudo apt update
           sudo apt install libdb-dev libperl-dev
      - name: Install dependencies
        if: runner.os != 'Windows'
        shell: bash
        run: |
          eval $(perl -I ~/perl5/lib/perl5 -Mlocal::lib)
          cpanm --notest --installdeps --verbose .

      - name: Install dependencies (Windows)
        if: runner.os == 'Windows'
        shell: cmd
        run: |
          @echo off
          set "PATH=%USERPROFILE%\perl5\bin;%PATH%"
          set "PERL5LIB=%USERPROFILE%\perl5\lib\perl5"
          cpanm --notest --installdeps --verbose .

      - name: Reinstall YAML::XS against current Perl (Windows)
        if: runner.os == 'Windows'
        shell: cmd
        run: cpanm --notest --reinstall YAML::XS

      - name: Lint and syntax check
        shell: perl {0}
        run: |
          use strict;
          use warnings;
          use File::Find;
          use lib 'lib';
          my @failed;
          push @INC, sub { open my $h, '<', \qq{1;\n}; $h };
          my @dirs = grep { -d } qw(lib bin);
          @dirs = ('.') unless @dirs;
          find({ wanted => sub {
              return unless -f && /\.pm$/;
              my $file = $File::Find::name;
              do $file;
              if ($@) {
                  warn "Syntax check failed: $file\n";
                  push @failed, $file;
              }
          }, no_chdir => 1 }, @dirs);

          if (($ENV{RUNNER_OS} // '') eq 'Linux') {
              system('cpanm --notest --quiet warnings::unused 2>/dev/null');
              system('PERL5OPT=-Mwarnings::unused prove -lr t/ 2>&1 | grep -i unused && true || echo "warnings::unused: no unused variables detected"');
          }

          exit(@failed ? 1 : 0);

      - name: Run tests
        if: runner.os != 'Windows'
        shell: bash
        run: |
          eval $(perl -I ~/perl5/lib/perl5 -Mlocal::lib)
          prove -lr t/

      - name: Run tests (Windows)
        if: runner.os == 'Windows'
        shell: cmd
        run: |
          @echo off
          set "PATH=%USERPROFILE%\perl5\bin;%PATH%"
          set "PERL5LIB=%USERPROFILE%\perl5\lib\perl5"
          prove -lr t/

      - name: Run Perl::Critic
        if: matrix.perl == '5.42' && matrix.os == 'ubuntu-latest'
        continue-on-error: true
        run: |
          eval $(perl -I ~/perl5/lib/perl5 -Mlocal::lib)
          cpanm --notest Perl::Critic
          perlcritic --severity 3 lib/ || true
        shell: bash

      - name: Check imports with perlimports
        if: matrix.perl == '5.42' && matrix.os == 'ubuntu-latest'
        continue-on-error: true
        run: |
          eval $(perl -I ~/perl5/lib/perl5 -Mlocal::lib)
          cpanm --notest App::perlimports
          find lib -name '*.pm' | xargs perlimports --lint
        shell: bash

      - name: Test coverage
        if: matrix.perl == '5.42' && matrix.os == 'ubuntu-latest'
        run: |
          eval $(perl -I ~/perl5/lib/perl5 -Mlocal::lib)
          cpanm --notest Devel::Cover
          cover -delete
          HARNESS_PERL_SWITCHES=-MDevel::Cover prove -lr t/
          cover
        shell: bash

      - name: Show cpanm build log on failure (Windows)
        if: runner.os == 'Windows' && failure()
        shell: pwsh
        run: Get-Content "$env:USERPROFILE\.cpanm\work\*\build.log" -Tail 100

      - name: Show cpanm build log on failure (non-Windows)
        if: runner.os != 'Windows' && failure()
        run: tail -100 "$HOME/.cpanm/work/*/build.log"
